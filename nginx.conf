server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;   # derrière Traefik : redirections relatives, donc restent en https
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Scripts : uniquement les fichiers du site et les 2 petits scripts en ligne du thème (empreintes).
    # Si un de ces 2 scripts change, recalculer l'empreinte (voir README).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-7y9/KNsyJQGWriyCQmEaf3FZwqU52r1AuCBxscB1YcY=' 'sha256-LEanec7Hp9KXOkzDCDl0OXni0Qhky6BZPProezyPv3U='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Aucun PHP ici : toute adresse PHP ou d'administration WordPress répond « disparu », sans journal.
    location ~* (\.php$|^/wp-admin|^/wp-json|^/xmlrpc) {
        access_log off;
        return 410;
    }
    # Anciennes adresses WordPress sans équivalent : vers l'accueil.
    location ~ ^/(feed|comments|category|author|wp-sitemap[^/]*)(/|$) { return 301 /; }

    location ~* \.(css|js|woff2|jpe?g|png|svg|pdf)$ { expires 30d; add_header Cache-Control "public"; }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /index.html;
}
